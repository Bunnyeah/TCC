<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./assets/Styles/usuario.css" rel="stylesheet">
    <title>Configurações da Conta</title>
</head>
<body>


    <nav id="navbar">
        <div id="logo"><img src="logo.jpg" alt="Logo Promel"></div>

        <div id="user_menu">
            <div class="icone"><img src="./assets/imgs/Group.svg" style="margin-right: 10px;">Minha Conta</div>
        
            <div id="user_pages">
                <div class="linha"><div class="seta"></div><a href=""><p class="botao pagatual">Perfil</p></a></div>
                <div class="linha"><div class="seta"></div><a href=""><p class="botao">Endereço</p></a></div>
                <div class="linha"><div class="seta"></div><a href=""><p class="botao">Trocar Senha</p></a></div>
                <div class="linha"><div class="seta"></div><a href=""><p class="botao">Histórico</p></a></div>
            </div>
        </div>
    </nav>

    <div class="container">
            <div class="col-12">
                <h3 class="my-5" id="title">Configurações da Conta</h3>
                <form enctype="multipart/form-data" class="row" action="login.html" method="GET">
                    <div class="col-7 mt-3">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome de usuário">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="insira seu email">
                        </div>
                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="number" class="form-control" id="telefone" name="telefone">
                        </div>
                    </div>
                    <div id="img_perfil" class="col-4 mb-3 ml-3">
                        <img src="./assets/imgs/img_perfil.png">
                        <input type="file" id="fotoperfil">
                    </div>
            </div>
            <div class="mb-3">
                <label for="another_info" class="form-label">Outras Informações</label>
                <textarea id="another_info" class="form-control" name="info" rows="3" style="resize: none;"></textarea>
            </div>            
            
                <div class="mb-3">
                    <a href=""><button type="button" id="btn" class="btn mt-3">Salvar todas as alterações</button></a>
                </div>       
            </form>
    </div>

</body>
</html>
