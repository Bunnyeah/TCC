<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", sans-serif;
            font-weight: 20px;
        }
        .container {
            height: 100vh;
            width: 313px;
            background-color: #133A41;
            color: #ffffff;
            display: flex;
            flex-direction: column;;
        }
        #logo img {
            max-width: 100%;
            height: auto;
        }
        #user_menu {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            margin-left: 40px;
        }
        .icon_user {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn {
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn:hover {
            text-decoration: underline;
        }
        a{
            color: #ffffff;
            text-decoration: none;
        }

    </style>

</head>
<body>

    <div class="container">
        <div id="logo"><img src="logo.jpg" alt="Logo Promel"></div>

        <div id="user_menu">
            <div class="icon_user inter-font"><img src="Group.svg" id="icon_user" style="margin-right: 10px;">Minha Conta</div>
            <a href=""><p class="btn">-- Perfil</p></a>
            <a href=""><p class="btn">-- Endereço</p></a>
            <a href=""><p class="btn">-- Trocar Senha</p></a>
            <a href=""><p class="btn">-- Histórico</p></a>
        </div>
    </div>

</body>
</html>
