<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", sans-serif;
            font-weight:300;
            font-size: 20px;
        }
        #navbar {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 313px;
            background-color: #133A41;
            color: #ffffff;
        }
        #logo img {
            max-width: 100%;
            height: auto;
        }
        #user_menu {
            display: flex;
            flex-direction: column;
            margin-left: 40px;
        }
        .user_config {
            margin-bottom: 10px;
            margin-left: 15px;
            font-size: 16px;
            border-left: 2px solid white;
        }
        .icon_user {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn {
            padding: 15px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn:hover {
            opacity: 60%;
            transition: 0.5s;
        }
        a{
            color: #ffffff;
            text-decoration: none;
        }
        

    </style>

</head>
<body>
    <nav id="navbar">
        <div id="logo"><img src="logo.jpg" alt="Logo Promel"></div>

    
        <div id="user_menu">
            <div class="icon_user"><img src="Group.svg" style="margin-right: 10px;">Minha Conta</div>
            <div class="user_config">
                <a href=""><p class="btn">-- Perfil</p></a>
                <a href=""><p class="btn">-- Endereço</p></a>
                <a href=""><p class="btn">-- Trocar Senha</p></a>
                <a href=""><p class="btn">-- Histórico</p></a>
            </div>
        </div>
    </nav>

</body>
</html>
